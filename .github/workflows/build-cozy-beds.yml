name: Cozy Beds / NeoForge 26.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/cozy-beds/**'
      - '.github/workflows/build-cozy-beds.yml'
  pull_request:
    paths:
      - 'mods/cozy-beds/**'
      - '.github/workflows/build-cozy-beds.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mods/cozy-beds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Cozy Beds 0.2
        run: gradle --no-daemon clean build --stacktrace
      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: CozyBeds-NeoForge-26.3-v0.2
          path: mods/cozy-beds/build/libs/CozyBeds-NeoForge-26.3-0.2.0.jar
          if-no-files-found: error
