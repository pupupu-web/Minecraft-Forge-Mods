name: Build Minecraft Forge 26.3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build the mod
        run: gradle --no-daemon build

      - name: Upload the compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ForgeBuildCheck-26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
