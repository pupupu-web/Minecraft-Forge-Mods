name: Build White Enderman 26.3

on:
  push:
    branches: [main]
    paths:
      - 'mods/white-enderman/**'
      - '.github/workflows/build-white-enderman.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mods/white-enderman/**'
      - '.github/workflows/build-white-enderman.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Restore original texture PNGs
        shell: bash
        run: |
          set -euo pipefail
          root=mods/white-enderman
          assets="$root/src/main/resources/assets/whiteenderman/textures"
          mkdir -p "$assets/entity" "$assets/item"
          base64 --decode "$root/assets-source/white_enderman.png.base64" > "$assets/entity/white_enderman.png"
          base64 --decode "$root/assets-source/white_enderman_spawn_egg.png.base64" > "$assets/item/white_enderman_spawn_egg.png"
          file "$assets/entity/white_enderman.png" "$assets/item/white_enderman_spawn_egg.png"

      - name: Build White Enderman mod
        working-directory: mods/white-enderman
        run: gradle --no-daemon build

      - name: Verify JAR metadata and textures
        run: |
          python3 - <<'PY'
          import glob, zipfile, sys
          jars = glob.glob("mods/white-enderman/build/libs/white-enderman-*.jar")
          if not jars: sys.exit("No White Enderman JAR found")
          required = [
              "META-INF/mods.toml",
              "pack.mcmeta",
              "assets/whiteenderman/textures/entity/white_enderman.png",
              "assets/whiteenderman/textures/item/white_enderman_spawn_egg.png",
              "dev/whiteenderman/WhiteEndermanMod.class",
          ]
          with zipfile.ZipFile(jars[0]) as z:
              missing = [entry for entry in required if entry not in z.namelist()]
              if missing: sys.exit("Missing JAR content: " + repr(missing))
              print("Verified:", jars[0])
          PY

      - name: Upload White Enderman JAR
        uses: actions/upload-artifact@v4
        with:
          name: WhiteEnderman-26.3
          path: mods/white-enderman/build/libs/white-enderman-*.jar
          if-no-files-found: error
          retention-days: 14
